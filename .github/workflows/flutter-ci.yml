name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true
      - name: Test generated Android configuration
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Validate course content
        run: python3 tool/validate_content.py
      - name: Check Android release prerequisites
        run: python3 tool/check_android_release.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests with coverage
        run: flutter test --coverage
      - name: Summarize Flutter test coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/coverage_summary.py coverage/lcov.info | tee coverage/summary.txt
          cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Archive Flutter test coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
