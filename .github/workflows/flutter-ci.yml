name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true
      - name: Test generated Android configuration
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Check Android release prerequisites
        run: python3 tool/check_android_release.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
