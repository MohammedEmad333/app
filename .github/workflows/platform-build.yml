name: Platform build smoke tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Generate web runner if missing
        run: flutter create --platforms=web .
      - run: flutter pub get
      - name: Build production web app
        run: flutter build web --release

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Test Android configuration idempotency
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Generate Android runner if missing
        run: flutter create --platforms=android .
      - name: Configure Android compatibility and permissions
        run: python3 tool/configure_android.py
      - name: Validate Android manifest permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          names = {p.get('{http://schemas.android.com/apk/res/android}name') for p in root.findall('uses-permission')}
          assert {'android.permission.RECORD_AUDIO', 'android.permission.INTERNET'} <= names
          print('Required Android permissions present')
          PY
      - run: flutter pub get
      - name: Install required Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.0.12077973"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          for attempt in 1 2 3; do
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION" < <(yes) && \
               test -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"; then
              echo "NDK installed and validated"
              exit 0
            fi
            echo "NDK installation attempt $attempt failed"
            sleep $((attempt * 10))
          done
          echo "Unable to install the required Android NDK" >&2
          exit 1
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK (CI smoke test only)
        run: flutter build apk --release
      - name: Verify release APK integrity and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > SHA256SUMS.txt)
          cat "$(dirname "$APK")/SHA256SUMS.txt"
          (cd "$(dirname "$APK")" && sha256sum --check SHA256SUMS.txt)
      - name: Archive release APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-production-signing-not-configured-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
