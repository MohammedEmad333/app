name: Platform build smoke tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Generate web runner if missing
        run: flutter create --platforms=web .
      - run: flutter pub get
      - name: Build production web app
        run: flutter build web --release

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Generate Android runner if missing
        run: flutter create --platforms=android .
      - name: Configure Android SDK requirements
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/settings.gradle.kts')
          content = path.read_text()
          content, count = re.subn(r'(id\("org.jetbrains.kotlin.android"\)\s+version\s+")[^"]+"', lambda m: m.group(1) + '2.2.20' + '"', content)
          assert count == 1, 'Kotlin Gradle plugin declaration not found'
          path.write_text(content)
          PY
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK (CI smoke test only)
        run: flutter build apk --release
      - name: Archive release APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-production-signing-not-configured-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
